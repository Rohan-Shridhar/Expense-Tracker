
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Expense Tracker</h1>
        <p>Track your spending, one expense at a time.</p>
    </header>

    <main>
        <section id="dashboard">
            <div class="summary-card">
                <p>Total Spent</p>
                <h2 id="dashboard-total">₹0.00</h2>
            </div>

            <div class="summary-card">
                <p>Total Expenses</p>
                <h2 id="dashboard-count">0</h2>
            </div>

            <div class="summary-card">
                <p>Top Category</p>
                <h2 id="dashboard-category">—</h2>
            </div>
        </section>

        <section id="expense-form-section">
            <h2>Add an Expense</h2>

            <form id="expense-form">
                <label for="title">Expense Title</label>
                <input type="text" id="title" name="title"
                    placeholder="e.g. Lunch" required>

                <label for="amount">Amount (₹)</label>
                <input type="number" id="amount" name="amount"
                    placeholder="e.g. 150" min="0.01" step="0.01" required>

                <label for="category">Category</label>
                <select id="category" name="category" required>
                    <option value="">Select a category</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Education">Education</option>
                    <option value="Bills">Bills</option>
                    <option value="Other">Other</option>
                </select>

                <label for="date">Date</label>
                <input type="date" id="date" name="date" required>

                <button type="submit">Add Expense</button>
            </form>
        </section>

        <section id="expense-list-section">
            <h2>Your Expenses</h2>
        <div id="date-filters">
            <div>
                <label for="start-date">From</label>
                <input type="date" id="start-date">
            </div>

            <div>
                <label for="end-date">To</label>
                <input type="date" id="end-date">
            </div>

            <button type="button" id="filter-button">Apply Filter</button>
            <button type="button" id="clear-filter-button">Clear</button>
        </div>
        <div id="category-filter">
            <label for="filter-category">Category</label>
            <select id="filter-category">
                <option value="">All Categories</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Shopping">Shopping</option>
                <option value="Education">Education</option>
                <option value="Bills">Bills</option>
                <option value="Other">Other</option>
            </select>
        </div>
            <p id="total-expenses">Loading expenses...</p>
            <div id="expense-list"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
